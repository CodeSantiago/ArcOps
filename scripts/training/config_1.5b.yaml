# ArcOps 1.5B — Lightweight model, runs without GPU
model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bf16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: none

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  learning_rate: 5.0e-5
  num_train_epochs: 4
  warmup_ratio: 0.03
  logging_steps: 5
  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit: 1
  optim: adamw_8bit
  bf16: true
  max_grad_norm: 0.3
  lr_scheduler_type: cosine
  max_seq_length: 1024
  output_dir: ./checkpoints-1.5b
  report_to: none

data:
  train_file: data/training_dataset.jsonl
  val_split: 0.2
  seed: 42
