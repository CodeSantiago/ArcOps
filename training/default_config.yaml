model:
  name: Qwen/Qwen2.5-7B-Instruct
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bf16
  bnb_4bit_use_double_quant: true

lora:
  r: 32
  lora_alpha: 64
  target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: none

training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 5.0e-5
  num_train_epochs: 4
  warmup_ratio: 0.03
  logging_steps: 5
  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit: 3
  optim: adamw_8bit
  bf16: true
  max_grad_norm: 0.3
  lr_scheduler_type: cosine
  max_seq_length: 512
  output_dir: ./checkpoints
  report_to: none

data:
  train_file: data/training_dataset.jsonl
  val_split: 0.2
  seed: 42
