schema: spec-driven

context: |
  Tech stack: Python 3.12 (managed by uv; planned: HuggingFace Transformers, PEFT, TRL, QLoRA, bitsandbytes, datasets)
  Architecture: Greenfield ML pipeline: dataset prep -> QLoRA fine-tune (Llama-3 8B) -> evaluation -> export
  Domain: CloudOps function calling - natural language instructions to structured JSON for AWS API calls
  Testing: pytest + pytest-cov installed; ruff for lint/format, mypy for type checking
  Style: src-layout with package data; uv-managed deps; strict TDD

strict_tdd: true

testing:
  runner: pytest
  test_command: "uv run pytest"
  coverage_command: "uv run pytest --cov=cloudops_fc --cov-report=term-missing"
  layers:
    unit: true
    integration: false
    e2e: false
  quality:
    linter: ruff
    type_checker: mypy
    formatter: ruff
  note: "Scaffolding complete. pytest-cov configured with 80% threshold. mypy blocked by Windows AppControl policy on this machine — not a code issue."

rules:
  proposal:
    - Include rollback plan for risky changes
    - State GPU/VRAM requirements and fallback strategy for training-related changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Include JSON schema examples for function-calling outputs
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Document model, dataset, and hyperparameter choices with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "uv run pytest"
  verify:
    test_command: "uv run pytest --cov=cloudops_fc --cov-report=term-missing"
    build_command: ""
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
