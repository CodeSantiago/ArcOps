[project]
name = "cloudops-fc"
version = "0.1.0"
description = "ArcOps - Local-first natural language to validated AWS tool calls."
requires-python = ">=3.12,<3.15"
dependencies = [
    "jsonschema>=4.23,<5",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Heavy ML stack (torch, transformers, bitsandbytes...) — only needed for
# model inference/training. Kept out of the base install so `pip install .`
# works cleanly on CPU-only Windows PowerShell and Linux.
train = [
    "torch>=2.6",
    "transformers>=4.47,<6",
    "datasets>=3.2,<5",
    "peft>=0.14,<1",
    "trl>=0.15,<2",
    "bitsandbytes>=0.45,<1",
    "accelerate>=1.2,<2",
    "huggingface_hub>=0.27,<2",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]
tui = [
    "textual>=1,<2",
    "rich>=13,<15",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
arcops = "cloudops_fc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cloudops_fc" = ["py.typed"]
"cloudops_fc.schemas" = ["*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
namespace_packages = false
ignore_missing_imports = false
disallow_untyped_defs = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "cloudops_fc.tui"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["torch", "peft", "transformers", "jsonschema"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["cloudops_fc"]
branch = true

[tool.coverage.report]
show_missing = true
