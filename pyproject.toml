[project]
name = "cloudops-fc"
version = "0.1.0"
description = "ArcOps - Natural language to AWS JSON tool calls. 100% local."
requires-python = ">=3.12,<3.15"
dependencies = [
    "jsonschema>=4.23,<5",
    "torch>=2.6",
    "transformers>=4.47",
    "datasets>=3.2",
    "peft>=0.14",
    "trl>=0.14,<0.15",
    "bitsandbytes>=0.45",
    "accelerate>=1.2",
    "huggingface_hub>=0.27",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
arcops = "cloudops:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudops_fc = ["schemas/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
namespace_packages = false
ignore_missing_imports = false
disallow_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["cloudops_fc"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
